name: RPM Publisher

run-name: RPM Publisher | ${{ github.event_name }} by ${{ github.actor }} on '${{ github.ref_name }}'

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  build-rpm:
    name: Building the RPM package
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/ci:latest # cmake (CPack), rpm-build

    outputs:
      version: ${{ steps.version_extract.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history of the version

      - name: Extract Git Tag version
        id: version_extract
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Same version as the AUR / Nix publishers
          if git describe --tags &> /dev/null; then
            VERSION=$(git describe --long --tags --abbrev=7 | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g')
          else
            COUNT=$(git rev-list --count HEAD)
            HASH=$(git rev-parse --short=7 HEAD)
            VERSION="0.0.0r${COUNT}.g${HASH}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✓ version $VERSION"

      - name: Build package (CPack)
        run: |
          set -euo pipefail
          cmake -S . -B build -DCASM_VERSION="${{ steps.version_extract.outputs.VERSION }}"
          cpack --config build/CPackConfig.cmake -G RPM -B build
        timeout-minutes: 5

      - name: Check package
        run: |
          set -euo pipefail
          FILE="build/casm-${{ steps.version_extract.outputs.VERSION }}-1.noarch.rpm"
          if [ ! -f "$FILE" ]; then
            echo "::error title=Missing package (RPM)::$FILE not found"
            exit 1
          fi

          # Files of the package: the script and its license, like the PKGBUILD
          CONTENT="$(rpm -qlp "$FILE")"
          for path in /usr/bin/casm /usr/share/licenses/casm/LICENSE; do
            if ! grep -qx "$path" <<< "$CONTENT"; then
              echo "::error title=Package content (RPM)::$path missing in $(basename "$FILE")"
              exit 1
            fi
          done
          echo "✓ Package ok -> $(basename "$FILE")"

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: rpm-package
          path: build/*.rpm
          if-no-files-found: error
          retention-days: 1

  publish-rpm:
    name: Publishing to gh-pages (RPM repository)
    needs: build-rpm
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/package:latest # createrepo_c, git

    concurrency:
      group: gh-pages-rpm-${{ github.repository }}
      cancel-in-progress: false # one publication at a time, never cancel one

    env:
      VERSION: ${{ needs.build-rpm.outputs.version }}

    steps:
      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: rpm-package
          path: build

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: gh-pages
          fetch-depth: 1

      - name: Switch to gh-pages (created by the first publication)
        working-directory: gh-pages
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE/gh-pages"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages
            git checkout -B gh-pages FETCH_HEAD
            echo "✓ gh-pages checked out"
          else
            git checkout --orphan gh-pages
            git rm -rf --quiet .
            git clean -fdxq
            echo "✓ gh-pages created (orphan branch)"
          fi

      - name: Repository files (index, .repo)
        run: |
          set -euo pipefail
          # Same files from the DEB Publisher: identical content, no conflict between the two publications
          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          touch gh-pages/.nojekyll
          cat > gh-pages/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8"><title>casm packages</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/${GITHUB_REPOSITORY}#installation-deb--rpm">
          </head><body><a href="https://github.com/${GITHUB_REPOSITORY}#installation-deb--rpm">casm installation</a></body></html>
          EOF

          # noarch packages: one repository for every release / architecture, unsigned (no GPG check)
          cat > gh-pages/casm.repo <<EOF
          [casm]
          name=casm repository
          baseurl=${PAGES_URL}/rpm
          enabled=1
          gpgcheck=0
          EOF
          echo "✓ casm.repo -> ${PAGES_URL}/rpm"

      - name: Sync files into gh-pages (RPM)
        run: |
          set -euo pipefail
          REPO_DIR="gh-pages/rpm"
          mkdir -p "$REPO_DIR"
          mv build/*.rpm "$REPO_DIR/"

          # Keep every build of a tag (vX.Y.Z -> X.Y.Z.r0.g<hash>), only the 5 last versions of the other builds
          find "$REPO_DIR" -maxdepth 1 -name 'casm-*.noarch.rpm' ! -name '*.r0.g*' -printf '%f\n' \
              | sort -V \
              | head -n -5 \
              | while read -r file; do echo "Prune old version: $file"; rm -f "${REPO_DIR:?}/${file:?}"; done

      - name: Update metadata (RPM)
        working-directory: gh-pages/rpm
        run: |
          set -euo pipefail
          createrepo_c --update .
          echo "✓ RPM repository: $(find . -maxdepth 1 -name '*.rpm' | wc -l) package(s)"

      - name: Commit and push
        working-directory: gh-pages
        run: |
          set -euo pipefail
          git config user.email "servoskull@omnissiah.mars"
          git config user.name "Servo Skull"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "workflow: publish casm ${VERSION} (rpm)"

          # gh-pages can move meanwhile (DEB Publisher or manual push): rebase on it and retry
          for attempt in 1 2 3 4 5; do
            if git push origin gh-pages; then
              echo "✓ casm ${VERSION} published (rpm)"
              exit 0
            fi
            echo "Push refused: rebase on the new gh-pages and retry ($attempt/5)..."
            git pull --rebase origin gh-pages
          done
          echo "::error title=Push::gh-pages not pushed after 5 attempts"
          exit 1
